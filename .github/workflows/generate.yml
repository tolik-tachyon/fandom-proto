name: Generate Proto

on:
  push:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install protoc
        run: sudo apt-get install -y protobuf-compiler

      - name: Install Go plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest

      - name: Generate
        run: |
          mkdir -p fandompb
          protoc \
            --go_out=fandompb --go_opt=paths=source_relative \
            --go-grpc_out=fandompb --go-grpc_opt=paths=source_relative \
            fandom/fandom.proto
          find fandompb -name "*.go" -not -path "fandompb/*.go" -exec mv {} fandompb/ \;
          find fandompb -mindepth 1 -type d -exec rm -rf {} + 2>/dev/null || true

      - name: Push to generated repo
        run: |
          git clone https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/tolik-tachyon/fandom-proto-generated.git gen-repo
          rm -rf gen-repo/fandompb
          mkdir -p gen-repo/fandompb
          cp fandompb/*.go gen-repo/fandompb/
          cd gen-repo
          go mod init github.com/tolik-tachyon/fandom-proto-generated
          go mod tidy
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add .
          git diff --staged --quiet || git commit -m "chore: regenerate proto"
          git push